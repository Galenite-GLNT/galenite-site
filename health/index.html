<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galenite Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div class="layout">
  <aside class="side-nav" id="sideNav"></aside>

  <main class="main" id="main">
    <header class="top">
      <div>
        <h1>Health</h1>
        <p id="todayLine" class="muted"></p>
      </div>
      <div class="top-actions">
        <input type="date" id="dayPicker" class="input input--compact">
        <button id="logoutBtn" class="btn btn--ghost">Выйти</button>
      </div>
    </header>

    <p id="statusLine" class="status"></p>
    <section id="appSections"></section>
  </main>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet" id="modalSheet">
    <button id="closeModal" class="btn btn--ghost">Закрыть</button>
    <div id="modalContent"></div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav"></nav>

<script type="module" src="./js/app.js"></script>
</body>
</html>
