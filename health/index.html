<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Galenite Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div>
      <h1>Health</h1>
      <p id="todayLine"></p>
    </div>
    <div class="top-actions">
      <button id="goalsBtn" class="ghost">Цели</button>
      <div class="account">
        <button id="accountBtn" class="account-btn">
          <span id="accountAvatar" class="account-avatar">U</span>
          <span id="accountName">Профиль</span>
        </button>
        <div id="accountMenu" class="account-menu hidden">
          <button id="logoutBtn" class="ghost account-logout">Выйти</button>
        </div>
      </div>
    </div>
  </header>

  <p id="statusLine" class="status"></p>
  <section class="grid" id="cards"></section>
  <section class="coach" id="coach"></section>
</div>

<div id="modal" class="modal hidden">
  <div class="sheet">
    <button id="closeModal" class="ghost">Закрыть</button>
    <div id="modalContent"></div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="#">Activity</a>
  <a href="#">Fitness</a>
  <a href="#">Plans</a>
  <a href="#" class="active">Progress</a>
</nav>

<script type="module" src="./js/app.js"></script>
</body>
</html>
